<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FluentAI — Reset password</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 28rem;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.5;
        color: #1a1a1a;
      }
      a.button {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 1rem;
        background: #5b4fcf;
        color: #fff;
        text-decoration: none;
        border-radius: 10px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>Reset your password</h1>
    <p>
      Open the FluentAI app, go to <strong>Sign in → Forgot password</strong>, and enter the
      six-digit code from your email. Codes expire in 10 minutes.
    </p>
    <p>
      If you did not request a reset, you can ignore the email — your account stays secure.
    </p>
    <p>
      <a class="button" href="fluentai://forgot-password">Open FluentAI app</a>
    </p>
  </body>
</html>
